[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trueparse"
version = "0.1.3"
description = "High-performance document parsing and layout intelligence engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Rituraj Raman" }
]
keywords = [
    "pdf",
    "pdf-parsing",
    "document-ai",
    "layout-analysis",
    "table-extraction",
    "ocr",
    "document-intelligence",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "pymupdf>=1.23.0",
    "pymupdf-layout>=1.24.0",
    "pydantic>=2.11.0",
    "pillow>=10.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/RITURAJRAMAN/TrueParse"
Documentation = "https://github.com/RITURAJRAMAN/TrueParse#readme"
"API Reference" = "https://github.com/RITURAJRAMAN/TrueParse/blob/main/docs/API_References.md"
"SDK Reference" = "https://github.com/RITURAJRAMAN/TrueParse/blob/main/docs/SDK_References.md"
Repository = "https://github.com/RITURAJRAMAN/TrueParse.git"
Issues = "https://github.com/RITURAJRAMAN/TrueParse/issues"
Changelog = "https://github.com/RITURAJRAMAN/TrueParse/blob/main/CHANGELOG.md"

[project.optional-dependencies]
api = ["fastapi>=0.115.0", "uvicorn>=0.30.0", "python-multipart>=0.0.18"]
client = ["httpx>=0.27.0"]
tokenizer = ["tiktoken>=0.7.0"]
ocr = [
    # Local OCR without system OCR packages.
    "rapidocr>=3.0.0",
    "onnxruntime>=1.17.0",
    "numpy>=1.24.0",
]
dev = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.18",
    "httpx>=0.27.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "jsonschema>=4.23.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
trueparse = "trueparse.cli.main:app"

[tool.setuptools]
include-package-data = false
package-dir = {trueparse = "src"}
packages = [
    "trueparse",
    "trueparse.api",
    "trueparse.chunking",
    "trueparse.cli",
    "trueparse.config",
    "trueparse.contracts",
    "trueparse.exporters",
    "trueparse.extraction",
    "trueparse.extraction.ocr",
    "trueparse.extraction.pdf",
    "trueparse.io",
    "trueparse.jobs",
    "trueparse.models",
    "trueparse.pipeline",
    "trueparse.pipeline.stages",
    "trueparse.processing",
    "trueparse.runtime",
    "trueparse.sdk",
]

[tool.setuptools.package-data]
trueparse = ["py.typed", "contracts/schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "ARG"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "B008",  # FastAPI/Typer depend on calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "ARG"]

[tool.ruff.lint.isort]
known-first-party = ["trueparse"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# The codebase is not fully annotated yet; these stay off until it is.
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pymupdf.*", "fitz.*", "rapidocr.*"]
ignore_missing_imports = true

# NumPy ships stubs using 3.12-only syntax, which trips the 3.10 target.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
