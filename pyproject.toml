[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trueparse"
version = "0.1.2"
description = "High-performance document parsing and layout intelligence engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "TrueParse Contributors" }
]
keywords = [
    "pdf",
    "pdf-parsing",
    "document-ai",
    "layout-analysis",
    "table-extraction",
    "ocr",
    "document-intelligence",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "pymupdf>=1.23.0",
    "pymupdf-layout>=1.24.0",
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/RITURAJRAMAN/TrueParse"
Documentation = "https://github.com/RITURAJRAMAN/TrueParse#readme"
Repository = "https://github.com/RITURAJRAMAN/TrueParse.git"
Issues = "https://github.com/RITURAJRAMAN/TrueParse/issues"
Changelog = "https://github.com/RITURAJRAMAN/TrueParse/blob/main/CHANGELOG.md"

[project.optional-dependencies]
ocr = [
    # Pure-wheel local OCR (no system packages), supporting Python 3.10-3.14.
    # The legacy rapidocr-onnxruntime package is also detected if present.
    "rapidocr>=3.0.0",
    "onnxruntime>=1.17.0",
    "numpy>=1.24.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
trueparse = "trueparse.cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
trueparse = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["trueparse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "B008",  # FastAPI/Typer depend on calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
files = ["src/trueparse"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# The codebase is not fully annotated yet; these stay off until it is.
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pymupdf.*", "fitz.*", "rapidocr.*", "rapidocr_onnxruntime.*"]
ignore_missing_imports = true

# numpy ships stubs using 3.12-only syntax, which trips the 3.10 target.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
