services:
  trueparse:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Set to "false" for a smaller image without scanned-document OCR.
        INSTALL_OCR: "true"
    container_name: trueparse-api
    ports:
      - "127.0.0.1:8000:8000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=1073741824,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - PYTHONUNBUFFERED=1
      - TRUEPARSE_JOBS_ROOT=/app/job-data
      # Uncomment to require an X-API-Key header on every parsing endpoint.
      # Authentication remains optional for every bind address.
      # - TRUEPARSE_API_KEY=change-me
      # - TRUEPARSE_CORS_ORIGINS=https://your-app.example.com
      # - TRUEPARSE_MAX_UPLOAD_MB=200
      # - TRUEPARSE_TIMEOUT_SECONDS=120
    volumes:
      - job-data:/app/job-data
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  job-data:
