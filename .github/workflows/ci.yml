name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Package & Dependencies
        run: |
          python -m pip install uv==0.13.5
          uv sync --frozen --extra dev --python python

      - name: Ruff
        run: uv run --frozen --extra dev ruff check src tests tools

      - name: Mypy
        run: uv run --frozen --extra dev mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Package & Dependencies
        run: |
          python -m pip install uv==0.13.5
          uv sync --frozen --extra dev --python python

      - name: Run Test Suite
        run: |
          uv run --frozen --extra dev pytest

  test-ocr:
    # OCR pulls onnxruntime and its models, so it runs on one platform only.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install System Libraries for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install Package with OCR Extra
        run: |
          python -m pip install uv==0.13.5
          uv sync --frozen --extra dev --extra ocr --extra tokenizer --python python
          uv run --frozen --extra dev --extra ocr --extra tokenizer python -c "import tiktoken; [tiktoken.get_encoding(name) for name in ('cl100k_base', 'o200k_base')]"

      - name: Run OCR-Dependent Tests
        run: |
          uv run --frozen --extra dev --extra ocr --extra tokenizer pytest tests/test_ocr.py tests/test_pipeline_upgrades.py tests/test_production_hardening.py -v

  container-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ocr: ['false', 'true']
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build --build-arg INSTALL_OCR=${{ matrix.ocr }} -t trueparse-ci .
      - name: Start container
        run: docker run -d --name trueparse-ci --read-only --tmpfs /tmp:size=268435456 -p 127.0.0.1:8000:8000 trueparse-ci
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs trueparse-ci
          exit 1
      - name: Parse an actual PDF
        run: |
          docker exec -i trueparse-ci python - <<'PY'
          import json
          import urllib.request
          import pymupdf
          with pymupdf.open() as pdf:
              page = pdf.new_page()
              page.insert_text((72, 72), 'Container extraction works.')
              content = pdf.tobytes()
          options = json.dumps({'formats':['json','text'], 'ocr':'never', 'strict':True})
          request = urllib.request.Request('http://127.0.0.1:8000/v1/parse', data=content,
              headers={'Content-Type':'application/pdf', 'X-Parse-Options':options})
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          assert result['status'] == 'completed'
          assert result['data']['json']['schema_version'] == '3.0'
          assert 'Container extraction works.' in result['data']['text']
          PY
      - name: Container logs
        if: always()
        run: docker logs trueparse-ci
